<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: sans-serif; text-align: center; padding: 3rem; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; }
    #status { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>Kho AI</h1>
  <button id="loginBtn">Đăng nhập bằng Google</button>
  <p id="status">Chưa đăng nhập</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import {
      getStorage,
      ref,
      uploadBytes
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgXBqxKCZFzgpY9BoyJWWGxOIPAbpLmx8",
      authDomain: "lamdrive.firebaseapp.com",
      projectId: "lamdrive",
      storageBucket: "lamdrive.firebasestorage.app",
      messagingSenderId: "818574734091",
      appId: "1:818574734091:web:ee115b6957fca0e781e80e",
      measurementId: "G-N31GEJE80L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const status = document.getElementById("status");

    loginBtn.addEventListener("click", async () => {
      status.textContent = "Đang mở cửa sổ đăng nhập...";
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          const phone = prompt("Nhập số điện thoại của bạn:");
          await setDoc(userRef, {
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            phone: phone
          });
        }

        status.textContent = "Đăng nhập thành công! Đang chuyển...";
        setTimeout(() => {
          location.href = "ai.html";
        }, 1000);
      } catch (error) {
        status.textContent = "Lỗi đăng nhập: " + error.message;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        status.textContent = "Đã đăng nhập! Đang chuyển...";
        setTimeout(() => {
          location.href = "ai.html";
        }, 1000);
      }
    });

    // Ví dụ upload file sau khi đăng nhập
    // const file = ...;
    // const fileRef = ref(storage, `users/${auth.currentUser.uid}/filename.txt`);
    // await uploadBytes(fileRef, file);
  </script>
</body>
</html>
